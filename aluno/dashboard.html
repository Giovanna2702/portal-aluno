        <header class="topo"><h1>📝 Exercícios</h1><p>Responda aos exercícios dos módulos já liberados.</p></header>
        <?php if ($mensagem): ?><div class="mensagem sucesso" role="status"><?= htmlspecialchars($mensagem, ENT_QUOTES, 'UTF-8') ?></div><?php endif; ?>
        <?php if ($erro): ?><div class="mensagem erro" role="alert"><?= htmlspecialchars($erro, ENT_QUOTES, 'UTF-8') ?></div><?php endif; ?>

        <?php if (!$modulos): ?>
            <div class="vazio">Nenhum exercício disponível.</div>
        <?php endif; ?>

        <?php foreach ($modulos as $modulo): ?>
            <section class="modulo">
                <header><span>MÓDULO <?= (int) $modulo['numero'] ?></span><h2><?= htmlspecialchars($modulo['nome'], ENT_QUOTES, 'UTF-8') ?></h2></header>
                <?php foreach ($modulo['exercicios'] as $exercicio): ?>
                    <article class="exercicio">
                        <h3><?= htmlspecialchars($exercicio['pergunta'], ENT_QUOTES, 'UTF-8') ?></h3>
                        <?php if ($exercicio['resposta_aluno'] !== null): ?>
                            <p class="resultado <?= (int) $exercicio['acertou'] === 1 ? 'certo' : 'errado' ?>">
                                Última resposta: <?= htmlspecialchars($exercicio['resposta_aluno'], ENT_QUOTES, 'UTF-8') ?> — <?= (int) $exercicio['acertou'] === 1 ? 'correta' : 'incorreta' ?>
                            </p>
                        <?php endif; ?>
                        <form method="POST" action="exercicios.php">
                            <input type="hidden" name="csrf_token" value="<?= htmlspecialchars($csrfToken, ENT_QUOTES, 'UTF-8') ?>">
                            <input type="hidden" name="exercicio_id" value="<?= (int) $exercicio['id'] ?>">
                            <?php foreach (['A','B','C','D'] as $letra): ?>
                                <?php $campo = 'alternativa_' . strtolower($letra); ?>
                                <label class="alternativa"><input type="radio" name="resposta" value="<?= $letra ?>" required> <strong><?= $letra ?>.</strong> <?= htmlspecialchars($exercicio[$campo], ENT_QUOTES, 'UTF-8') ?></label>
                            <?php endforeach; ?>
                            <button type="submit">Responder</button>
                        </form>
                    </article>
                <?php endforeach; ?>
            </section>
        <?php endforeach; ?>
    </main>
</body>
</html>
